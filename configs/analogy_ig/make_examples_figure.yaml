caption: >-
  Five analogies from the benchmark. All numbers are in nats (natural-log probability units) and are
  averaged over six language models. For the target path, the number is the increase in its
  log-probability when the model has seen the source path, compared with seeing only the relations of
  the path; the number in parentheses is the same quantity when the model is instead only told which
  concept the analogy comes from, without its path. For each fact about the invented concept, the number is the increase in its
  log-probability when the model has seen the full analogy, compared with seeing only the target domain.
  Existing facts about the source concept are scored the same way. Judgements are by a panel of three
  language models.
